<!-- Plantilla "Confirm signup" de Supabase Auth. Copiar igual en producción (Dashboard → Authentication → Emails). -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;color:#0a0a0a">
  <h1 style="font-size:28px;text-transform:uppercase;margin:0 0 8px">Verifica tu correo</h1>
  <p style="margin:0 0 16px">Escribe este código en StylerNow para activar tu cuenta:</p>
  <p style="font-size:36px;font-weight:900;letter-spacing:8px;margin:0 0 16px;font-family:'Courier New',monospace">{{ .Token }}</p>
  <p style="margin:0 0 16px;color:#555">El código vence en 1 hora. Si no creaste una cuenta en StylerNow, ignora este correo.</p>
</div>
