name: CI

# Cada PR y cada push a main: tipos, lint, cobertura de autorización, pruebas unitarias y build.
# No usa secretos reales: el build recibe valores de relleno (la app no se conecta a nada durante `next build`).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-de-relleno
      SUPABASE_SECRET_KEY: secreta-de-relleno
      NEXT_PUBLIC_SITE_URL: https://ejemplo.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Cobertura de autorización (rutas privadas con guardia explícita)
        run: npm run check:auth
      - name: Textos legales sincronizados
        run: npm run check:legal
      - name: Pruebas unitarias y cobertura
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Secretos en bundle
        run: npm run check:bundle

  mutacion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-de-relleno
      SUPABASE_SECRET_KEY: secreta-de-relleno
      NEXT_PUBLIC_SITE_URL: https://ejemplo.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas de mutación Fase 7
        run: npm run mutation

  e2e-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Navegador Chromium
        run: npx playwright install --with-deps chromium
      - name: Sembrar Supabase local
        run: npm run e2e:preparar
      - name: E2E por roles y viewports
        run: npm run e2e

  auditoria-dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Solo avisa (no bloquea): el hallazgo conocido de `uuid` (vía exceljs) es moderado.
      - run: npm audit --omit=dev --audit-level=high
